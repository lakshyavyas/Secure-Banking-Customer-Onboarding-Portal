spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/authdb

spring.datasource.username=root
spring.datasource.password=navalvyas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Server Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Max login attempts before locking account
app.security.max-login-attempts=3
#
## Account lock duration in minutes
app.security.lock-duration-minutes=15
